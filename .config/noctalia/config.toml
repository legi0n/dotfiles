[nightlight]
enabled = true

[plugin_settings."noctalia/screen_recorder"]
audio_source = "both"
copy_to_clipboard = true
hide_inactive = true
video_encoder = "cpu"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
polkit_agent = true
screen_time_enabled = true
show_location = false

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    wallpaper_placement = "floating"

    [shell.screenshot]
    annotate = true
    directory = "~/Pictures/Screenshots"

[theme]
builtin = "Tokyo-Night"
mode = "dark"
source = "builtin"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "kitty", "qt" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[widget.network]
show_vpn_label = true

[widget.notifications]
hide_when_no_unread = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.workspaces]
active_pill_size = 2.7000000000000002
empty_color = "on_secondary"
focused_output_only = true
hide_when_empty = true
inactive_pill_size = 2.25
occupied_color = "on_secondary"
scale = 1.1000000000000001
